name: Build C/C++

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
 linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build inside CentOS 7
      run: |
        docker run --rm -v "$PWD":/src -w /src centos:7 bash -c '
          set -e
          sed -i.bak "s/mirrorlist/#mirrorlist/g" /etc/yum.repos.d/CentOS-*
          sed -i.bak "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*
          yum -y makecache
          yum -y install @"Development Tools" glibc-devel.i686 libgcc.i686 libstdc++-devel.i686 libstdc++-static.i686 wget
          export CPATH=$CPATH:/usr/include/c++/4.8.5/i686-redhat-linux
          cd AccuracyFix && make
        '

    - name: Collect files
      run: |
        mkdir -p publish/addons/accuracyfix/dlls
        mv AccuracyFix/Release/accuracyfix_mm.so publish/addons/accuracyfix/dlls/
        mv cstrike/addons/accuracyfix/accuracyfix.cfg publish/addons/accuracyfix/

    - name: Deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux32
        path: publish/*
        
  windows:
    name: Windows Build
    runs-on: windows-latest
      
    env:
      SOLUTION_FILE_PATH: .
      BUILD_CONFIGURATION: Release
  
    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Run Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Move release file to publish
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        # Make publish directory
        mkdir publish\addons\accuracyfix\dlls

        # Move released dll to publish
        move ${{env.BUILD_CONFIGURATION}}\*.dll publish\addons\accuracyfix\dlls

        # Move settings file to folder
        mv ${{env.SOLUTION_FILE_PATH}}\cstrike\addons\accuracyfix\accuracyfix.cfg publish\addons\accuracyfix\accuracyfix.cfg

    - name: Deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win32
        path: publish/*
